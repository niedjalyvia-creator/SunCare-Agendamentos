<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Cadastro</title>
    <link rel='stylesheet' href='main.css'>
</head>
<body>
    <h1>Cadastro</h1>
    <h2>Sistema de agendamentos Bronze</h2>
    <form id="form-cadastro" action="/cadastro_cliente" method="POST">
        <label>Email:</label>
        <input id="email_cadastro" name="email_cadastro"type="email" placeholder="Digite seu email" required>
        <label>Senha:</label>
        <input id="senha_cadastro" name="senha_cadastro" type="password" placeholder="Digite sua senha" required>
        <button type="submit">Cadastrar</button>
        <button type="button" onclick="window.location.href='index.html'">Voltar ao inicio</button>
    </form>
</body>
</html></html>
