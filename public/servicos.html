<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Serviços</title>
    <link rel='stylesheet' href='main.css'>
</head>
<body>
    <h1>Cadastro de Serviços</h1>
    <form id="form-cadastro_servico" action="/cadastro_servico" method="POST">
        <label>Nome do Serviço:</label>
        <input id="nome_servico" name="nome_servico" type="text" placeholder="Digite o nome do serviço" required>
        <label>Preço:</label>
        <input id="preco" name="preco" type="number" step="0.01" placeholder="Digite o preço do serviço" required>
        <label>Duração (minutos):</label>
        <input id="duracao" name="duracao_minutos" type="number" placeholder="Digite a duração do serviço em minutos" required>
        <button type="submit">Cadastrar</button>
        <button type="button" onclick="window.location.href='index.html'">Voltar ao inicio</button>
    </form>
</body>
</html></html>
