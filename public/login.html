<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Login</title>
    <link rel='stylesheet' href='main.css'>
</head>
<body>
    <h1>Login</h1>
    <h2>Sistema de agendamentos Bronze</h2>
    <form id="form-login" action="/login" method="POST">
        <label>Email:</label>
        <input id="email_login" name="email_login" type="email" placeholder="Digite seu email" required>
        <label>Senha:</label>
        <input id="senha_login" name="senha_login" type="password" placeholder="Digite sua senha" required>
        <button type="submit">Entrar</button>
    </form>
</body>
</html></html>
